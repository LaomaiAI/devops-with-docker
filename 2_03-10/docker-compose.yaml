services:
  nginx:
    image: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
  frontend:
    build:
      context: ../example-app/frontend
    expose:
      - "5001"
  backend:
    build:
      context: ../example-app/backend
    expose:
      - "8080"
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=postgres
      - REQUEST_ORIGIN=http://localhost:8000
    depends_on:
      - redis
      - db
    restart: unless-stopped
  redis:
    image: redis
    expose:
      - "6379"
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./database:/var/lib/postgresql/data
    expose:
      - "5432"
